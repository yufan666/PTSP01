name: Debug kconfig merge (DEVMEM)

# 诊断用：3~4 分钟复现 OpenWrt 内核 config 的完整生成链，
# 定位 CONFIG_DEVMEM=y 在哪一步被吃掉。不编译内核，只跑元数据处理。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: debug kconfig
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gawk libncurses-dev

      - name: Clone OpenWrt v25.12.0
        run: |
          git clone --depth 1 --branch v25.12.0 \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='基线: %H %s'

      # ===== 与主 workflow 的 Apply 2/4 段完全一致 =====
      - name: Apply same patches as main workflow
        run: |
          set -euo pipefail
          cd openwrt
          KVER=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/ath79/Makefile | tr -d ' \t')
          GENC="target/linux/generic/config-$KVER"
          KCFG="target/linux/ath79/config-$KVER"
          for f in "$GENC" "$KCFG"; do
            [ -f "$f" ] || { echo "!! 缺少 $f"; exit 1; }
          done
          echo "内核版本: $KVER  GENC=$GENC  KCFG=$KCFG"

          DEVMEM_BLOCK=$(cat ../config/kernel-extra.config)
          MARK='# ==== PTSP01: /dev/mem for PL7223 bitbang ===='

          sed -i -E 's/^[[:space:]]*#[[:space:]]*CONFIG_DEVMEM[[:space:]]+is not set[[:space:]]*$/CONFIG_DEVMEM=y/' "$GENC"
          sed -i -E 's/^CONFIG_IO_STRICT_DEVMEM=y[[:space:]]*$/# CONFIG_IO_STRICT_DEVMEM is not set/' "$GENC"

          printf '\n%s\n%s\n' "$MARK" "$DEVMEM_BLOCK" >> "$GENC"
          printf '\n%s\n%s\n' "$MARK" "$DEVMEM_BLOCK" >> "$KCFG"
          for sf in target/linux/ath79/*/config-default; do
            [ -f "$sf" ] || continue
            printf '\n%s\n%s\n' "$MARK" "$DEVMEM_BLOCK" >> "$sf"
          done

          grep -q '^CONFIG_DEVMEM=y$' "$GENC" || { echo "!! generic 未写入"; exit 1; }
          grep -q '^CONFIG_DEVMEM=y$' "$KCFG" || { echo "!! target 未写入"; exit 1; }
          echo "✓ 补丁已写入（与主 workflow 相同）"

          # 证据 1：三份文件的 DEVMEM 相关行 + 文件尾
          mkdir -p "$GITHUB_WORKSPACE/debug"
          D="$GITHUB_WORKSPACE/debug"
          grep -n 'DEVMEM' "$GENC" "$KCFG" target/linux/ath79/*/config-default > "$D/00_patched_devmem_lines.txt" || true
          tail -8 "$GENC" > "$D/01_generic_tail.txt"
          tail -8 "$KCFG" > "$D/02_target_tail.txt"
          tail -8 target/linux/ath79/generic/config-default > "$D/03_subtarget_tail.txt"
          echo "--- generic/config-6.12 尾部 ---"; cat "$D/01_generic_tail.txt"

      # ===== 生成 buildroot .config（DUMP 元数据需要） =====
      - name: make defconfig
        run: |
          cd openwrt
          cp ../config/buildroot.config .config
          make defconfig

      # ===== 证据 2：make 自己认为的 merge 命令是什么 =====
      - name: Capture real LINUX_CONF_CMD
        run: |
          cd openwrt
          D="$GITHUB_WORKSPACE/debug"
          make -C target/linux DUMP=1 -n 2>/dev/null | grep -o 'scripts/kconfig\.pl.*' | head -2 > "$D/10_real_merge_cmd.txt" || echo "(未能捕获)" > "$D/10_real_merge_cmd.txt"
          echo "--- OpenWrt 实际使用的 merge 命令 ---"
          cat "$D/10_real_merge_cmd.txt" || true

      # ===== 证据 3：跑 OpenWrt 自己的 DUMP 合并 =====
      - name: Run real DUMP merge
        run: |
          cd openwrt
          D="$GITHUB_WORKSPACE/debug"
          make -C target/linux DUMP=1 >/dev/null 2>&1 || echo "(DUMP 有告警，继续)"
          echo "--- tmp/.kconfig-* 中的 DEVMEM 行（OpenWrt 官方 merge 结果） ---"
          ls tmp/.kconfig-* 2>/dev/null || echo "(没找到 tmp/.kconfig-*)"
          grep -n 'DEVMEM' tmp/.kconfig-* > "$D/11_dump_merge_devmem.txt" || echo "!! DUMP 合并结果里没有 DEVMEM 行" | tee "$D/11_dump_merge_devmem.txt"
          cat "$D/11_dump_merge_devmem.txt"

      # ===== 证据 4：按我理解的顺序手工 merge =====
      - name: Manual merge in believed order
        run: |
          cd openwrt
          D="$GITHUB_WORKSPACE/debug"
          perl scripts/kconfig.pl + + \
            target/linux/generic/config-6.12 \
            target/linux/ath79/config-6.12 \
            target/linux/ath79/generic/config-default \
            > "$D/12_manual_merge.cfg" || echo "(手工 merge 失败)"
          echo "--- 手工 merge（generic→target→subtarget）的 DEVMEM 行 ---"
          grep -n 'DEVMEM' "$D/12_manual_merge.cfg" || echo "!! 手工 merge 结果无 DEVMEM 行"
          grep -c 'CONFIG_DEVMEM=y' "$D/12_manual_merge.cfg" || true

      # ===== 证据 5：完整复刻 Kernel/Configure/Default 的数据流 =====
      - name: Replicate Kernel/Configure/Default
        run: |
          cd openwrt
          D="$GITHUB_WORKSPACE/debug"
          # 逐行复刻 include/kernel-defaults.mk 的 Kernel/Configure/Default：
          perl scripts/kconfig.pl + + \
            target/linux/generic/config-6.12 \
            target/linux/ath79/config-6.12 \
            target/linux/ath79/generic/config-default > /tmp/.config.target
          awk '/^(#[[:space:]]+)?CONFIG_KERNEL/{sub("CONFIG_KERNEL_","CONFIG_");print}' .config >> /tmp/.config.target
          echo "# CONFIG_KALLSYMS_EXTRA_PASS is not set" >> /tmp/.config.target
          echo "# CONFIG_KALLSYMS_ALL is not set" >> /tmp/.config.target
          echo "CONFIG_KALLSYMS_UNCOMPRESSED=y" >> /tmp/.config.target
          perl scripts/package-metadata.pl kconfig tmp/.packageinfo .config 6.12 > /tmp/.config.override
          perl scripts/kconfig.pl 'm+' '+' /tmp/.config.target /dev/null /tmp/.config.override > /tmp/.config.set
          echo "===== .config.target 的 DEVMEM 行 ====="
          grep -n 'DEVMEM' /tmp/.config.target || echo "!! .config.target 无 DEVMEM 行"
          echo "===== .config.override 的 DEVMEM 行 ====="
          grep -n 'DEVMEM' /tmp/.config.override || echo "(.config.override 无 DEVMEM 行，正常)"
          echo "===== .config.set 的 DEVMEM 行（= 内核 .config 的最终来源） ====="
          grep -n 'DEVMEM' /tmp/.config.set || echo "!! .config.set 无 DEVMEM 行 —— 找到凶手环节"
          cp /tmp/.config.target /tmp/.config.override /tmp/.config.set "$D/" 2>/dev/null || true

      # ===== 打包全部证据 =====
      - name: Upload debug evidence
        uses: actions/upload-artifact@v4
        with:
          name: debug-kconfig
          path: ${{ github.workspace }}/debug/
          if-no-files-found: warn
          retention-days: 7
