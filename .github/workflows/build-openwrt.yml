name: Build OpenWrt for PTSP01

# 云编译 PTSP01 插排（AR9331 / 16MB flash / 64MB RAM）专用 OpenWrt 固件
#
# 为什么必须走「源码编译」而不是官方 Image Builder：
#   Image Builder 用的是预编译内核，改不了内核 config。
#   而我们需要 CONFIG_DEVMEM —— PL7223 原厂驱动是位带写法（直接读写 SPI 块
#   的 IOC/RDS 寄存器，125kHz），硬件 SPI 引擎最低只到 1.5625MHz，
#   只有拿到 /dev/mem 才能在用户态复刻原厂时序。
#
# 用法：仓库 → Actions → Build OpenWrt for PTSP01 → Run workflow

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt tag / branch'
        required: true
        default: 'v25.12.0'
        type: string
      with_luci:
        description: '打包 LuCI 网页界面（会多花约 25 分钟）'
        required: true
        default: false
        type: boolean
      extra_packages:
        description: '额外包，空格分隔（例如 "wpad-mini kmod-usb-storage"）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.openwrt_ref }}
  cancel-in-progress: false

env:
  OPENWRT_REF: ${{ inputs.openwrt_ref }}
  TARGET: ath79
  SUBTARGET: generic
  PROFILE: 8dev_carambola2

jobs:
  build:
    name: build ath79/generic
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OpenWrt 全量编译大约要 15~20GB，标准 runner 余量不够，先清一下
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget ccache

      - name: Clone OpenWrt ${{ inputs.openwrt_ref }}
        run: |
          git clone --depth 1 --branch "$OPENWRT_REF" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='构建基线: %H  %s'

      - name: Restore downloads cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.TARGET }}-${{ inputs.openwrt_ref }}
          restore-keys: |
            dl-${{ env.TARGET }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.TARGET }}-${{ inputs.openwrt_ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.TARGET }}-${{ inputs.openwrt_ref }}-
            ccache-${{ env.TARGET }}-

      - name: Apply PTSP01 customizations
        run: |
          set -euo pipefail
          cd openwrt

          echo "===== 1/4 设备树 ====="
          cp -v ../dts/ar9331_8dev_carambola2.dts \
                target/linux/ath79/dts/ar9331_8dev_carambola2.dts

          echo "===== 2/4 内核：打开 /dev/mem ====="
          # 直接从 ath79 的 Makefile 读内核版本号，避免 ls|sort 猜错文件
          KVER=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/ath79/Makefile | tr -d ' \t')
          GENC="target/linux/generic/config-$KVER"
          KCFG="target/linux/ath79/config-$KVER"
          for f in "$GENC" "$KCFG"; do
            [ -f "$f" ] || { echo "!! 缺少 $f"; exit 1; }
          done
          echo "  内核版本 : $KVER"
          echo "  generic  : $GENC"
          echo "  target   : $KCFG"

          # 背景：OpenWrt 用 kconfig.pl 依序合并 generic -> target -> subtarget
          # 三份 config，后者覆盖前者；而对同一文件内的重复条目是「后出现的赢」。
          # 上一版只 sed generic + 追加 target，结果 DEVMEM 仍是 n —— 说明顺序
          # 假设不可靠。这里把 generic、target、以及全部子目标 config-default
          # 的末尾都写入，无论 merge 顺序如何，结果都必然是 y。
          DEVMEM_BLOCK=$(cat ../config/kernel-extra.config)
          MARK='# ==== PTSP01: /dev/mem for PL7223 bitbang ===='

          # 坑 1：generic 里显式写了 "# CONFIG_DEVMEM is not set"，翻成 y
          # 坑 2：IO_STRICT_DEVMEM=y 会拦掉已被驱动登记的 I/O 区域，关掉
          # （正则容忍行尾空白/CR，避免匹配失败后静默无效）
          sed -i -E 's/^[[:space:]]*#[[:space:]]*CONFIG_DEVMEM[[:space:]]+is not set[[:space:]]*$/CONFIG_DEVMEM=y/' "$GENC"
          sed -i -E 's/^CONFIG_IO_STRICT_DEVMEM=y[[:space:]]*$/# CONFIG_IO_STRICT_DEVMEM is not set/' "$GENC"

          printf '\n%s\n%s\n' "$MARK" "$DEVMEM_BLOCK" >> "$GENC"
          printf '\n%s\n%s\n' "$MARK" "$DEVMEM_BLOCK" >> "$KCFG"
          for sf in target/linux/ath79/*/config-default; do
            [ -f "$sf" ] || continue
            printf '\n%s\n%s\n' "$MARK" "$DEVMEM_BLOCK" >> "$sf"
            echo "  已追加: $sf"
          done

          echo "  --- 处理后 ---"
          grep -n 'DEVMEM' "$GENC" "$KCFG" target/linux/ath79/*/config-default || true

          # 自检：写不进去就当场报错，不要白跑 40 分钟
          grep -q '^CONFIG_DEVMEM=y$' "$GENC" || { echo "!! generic 未写入 DEVMEM=y"; exit 1; }
          grep -q '^CONFIG_DEVMEM=y$' "$KCFG" || { echo "!! target 未写入 DEVMEM=y"; exit 1; }
          echo "  ✓ DEVMEM=y 已写入 generic + target + 全部 subtarget"

          echo "===== 3/4 打包进镜像的文件 ====="
          mkdir -p files
          if [ -d ../files ]; then
            cp -av ../files/. files/
          else
            echo "  (仓库里没有 files/，跳过)"
          fi

          echo "===== 4/4 生成 .config ====="
          cp ../config/buildroot.config .config
          make defconfig

          # 坑 3（Run4 的真凶）：include/kernel-defaults.mk 的 Kernel/Configure/Default
          # 会用 awk 把 buildroot .config 里所有 CONFIG_KERNEL_* 行、去掉 KERNEL_
          # 前缀后【追加到内核 .config.target 的末尾】——同一文件后者胜。
          # 而 make defconfig 会把包元数据引用到的内核符号写成
          #   # CONFIG_KERNEL_DEVMEM is not set
          # 这行被 awk 追加后就覆盖了我们补进 target config 的 DEVMEM=y。
          # 对策：在 buildroot 层也打开它，这样 awk 追加的就是 CONFIG_DEVMEM=y。
          # 注意：不能调 ./scripts/config —— OpenWrt 源码树里 scripts/config 是
          # 【目录】（kconfig 工具源码 conf.c/mconf.c 所在），不是可执行文件，
          # 直接执行会报 "Is a directory"（exit 126）。改用 sed 翻行：
          #   符号存在且为 not set -> sed 翻成 y（defconfig 会保留合法的显式 y）
          #   符号不存在           -> 直接追加，defconfig 会丢弃未知符号，无副作用
          if grep -q '^# CONFIG_KERNEL_DEVMEM is not set$' .config; then
            sed -i 's/^# CONFIG_KERNEL_DEVMEM is not set$/CONFIG_KERNEL_DEVMEM=y/' .config
            echo "  已翻 KERNEL_DEVMEM: not set -> y"
          else
            echo 'CONFIG_KERNEL_DEVMEM=y' >> .config
            echo "  (buildroot 层原本无 KERNEL_DEVMEM 行，直接追加 y)"
          fi
          make defconfig

          enable_pkg() {
            # 等价于旧版 ./scripts/config -e（那个写法在 OpenWrt 里是目录，跑不了）
            if grep -q "^# CONFIG_PACKAGE_$1 is not set$" .config; then
              sed -i "s/^# CONFIG_PACKAGE_$1 is not set$/CONFIG_PACKAGE_$1=y/" .config
            else
              echo "CONFIG_PACKAGE_$1=y" >> .config
            fi
          }

          if [ "${{ inputs.with_luci }}" = "true" ]; then
            echo "  追加 LuCI（先装 feeds，否则 luci 符号不在 kconfig 里，会被 defconfig 丢弃）"
            ./scripts/feeds update -a
            ./scripts/feeds install luci
            enable_pkg luci
            enable_pkg luci-ssl
            make defconfig
          fi

          if [ -n "${EXTRA_PKGS:-}" ]; then
            echo "  追加额外包: $EXTRA_PKGS"
            for p in $EXTRA_PKGS; do
              enable_pkg "$p"
            done
            make defconfig
          fi

          echo "----- 最终关键配置 -----"
          grep -E '^CONFIG_TARGET_(ath79|ath79_generic|ath79_generic_DEVICE)|^CONFIG_PACKAGE_(kmod-i2c-gpio|kmod-gpio-pca953x|luci|i2c-tools)' .config || true

          # 自检 2：buildroot 层的 KERNEL_DEVMEM 必须是 y（坑 3 的最终防线）。
          # 若它仍是 not set，内核构建时 awk 会把 "# CONFIG_DEVMEM is not set"
          # 追加到 .config.target 末尾，覆盖 DEVMEM=y —— 直接快速失败。
          echo "  KERNEL_DEVMEM 行: $(grep -E 'CONFIG_KERNEL_DEVMEM' .config || echo '(无此行)')"
          grep -q '^CONFIG_KERNEL_DEVMEM=y$' .config || {
            echo "!! buildroot 层 KERNEL_DEVMEM 未打开，awk 注入会覆盖 DEVMEM=y"; exit 1
          }
          echo "  ✓ CONFIG_KERNEL_DEVMEM=y，awk 追加的将是 CONFIG_DEVMEM=y"
        env:
          EXTRA_PKGS: ${{ inputs.extra_packages }}

      - name: Download sources
        run: |
          cd openwrt
          make download -j"$(nproc)" || make download -j1 V=s
          echo "dl 目录大小: $(du -sh dl | cut -f1)"

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          if ! make -j"$(nproc)" > build.log 2>&1; then
            echo "::group::构建失败，日志尾部"
            tail -n 400 build.log
            echo "::endgroup::"
            exit 1
          fi
          echo "构建完成"

      - name: Show artifacts
        run: |
          cd openwrt
          ls -lh bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/
          echo "----- sysupgrade 校验 -----"
          sha256sum bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*sysupgrade.bin || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ptsp01-${{ inputs.openwrt_ref }}
          path: |
            openwrt/bin/targets/ath79/generic/*.bin
            openwrt/bin/targets/ath79/generic/*.manifest
            openwrt/bin/targets/ath79/generic/sha256sums
          if-no-files-found: error
          retention-days: 30

      # 固件已上传完成后再做校验：即使这里挂了，artifact 也不会丢
      - name: Verify kernel config actually took effect
        run: |
          cd openwrt
          # 注意：不能用 -path '*linux-*' —— mac80211 的 backports 源码树里
          # 也有自己的 .config（build_dir/target-*/mac80211-regular/backports-*/.config），
          # find 顺序靠前就会抓错文件，误判 DEVMEM 没生效。
          # 用 *linux-6* 锁定真正的内核构建目录（内核源码树形如 linux-6.12.71）。
          KCFG=$(find build_dir -maxdepth 5 -path '*linux-6*/.config' | head -n 1)
          if [ -z "$KCFG" ]; then
            echo "!! find 没匹配到内核 .config，所有候选如下（用于排查）："
            find build_dir -maxdepth 5 -name '.config' | head -n 20
            exit 1
          fi
          echo "内核 .config: $KCFG"
          grep -E 'DEVMEM' "$KCFG" || true
          if grep -q '^CONFIG_DEVMEM=y$' "$KCFG"; then
            echo "✓ CONFIG_DEVMEM 已生效"
          else
            echo "✗ CONFIG_DEVMEM 没进内核，/dev/mem 方案会失效"; exit 1
          fi
          if grep -q '^CONFIG_IO_STRICT_DEVMEM=y$' "$KCFG"; then
            echo "✗ IO_STRICT_DEVMEM 仍然开着，mmap 0x1f000000 会被拒绝"; exit 1
          else
            echo "✓ IO_STRICT_DEVMEM 已关闭"
          fi

      # 用 OpenWrt 工具链（与固件 ABI 完全一致：mips24kc 软浮点 O32 musl）
      # 编译用户态工具。 zig cc 产出的 mips BE 静态二进制在 24Kc 上 SIGILL，
      # 所以必须用同款工具链。
      # 注意：放在 Verify 之后 —— 上轮这步排在固件上传之前，失败把固件
      # 上传/校验一起跳过了（教训）。
      - name: Compile userland tools
        run: |
          set -euo pipefail
          cd openwrt
          # 注意 find -path 是整条路径全匹配：'*toolchain*/bin' 永远匹配不到
          # （bin 后面还有文件名），上轮就是栽在这里
          GCC=$(ls staging_dir/toolchain-*/bin/*-gcc 2>/dev/null | head -n 1 || true)
          if [ -z "$GCC" ]; then
            echo "!! 找不到工具链 gcc，staging_dir 内容："
            ls staging_dir/ || true
            exit 1
          fi
          echo "工具链: $GCC"
          "$GCC" --version | head -n 1
          cp ../tools/devmem.c devmem.c
          cp ../tools/pl7223bb.c pl7223bb.c
          cp ../tools/spitest.c spitest.c
          "$GCC" -static -O2 -o devmem devmem.c
          "$GCC" -static -O2 -o pl7223bb pl7223bb.c
          "$GCC" -static -O2 -o spitest spitest.c
          "${GCC%gcc}strip" devmem pl7223bb spitest || true
          file devmem pl7223bb spitest || true
          ls -lh devmem pl7223bb spitest

      - name: Upload userland tools
        uses: actions/upload-artifact@v4
        with:
          name: ptsp01-tools
          path: |
            openwrt/devmem
            openwrt/pl7223bb
            openwrt/spitest
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 7
