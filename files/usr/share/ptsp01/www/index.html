<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTSP01 插排控制台</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e6e9ef;
    --dim:#8b93a3; --green:#3ecf6e; --red:#ef5350; --amber:#ffb74d;
    --blue:#4f8ef7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;padding:24px 16px}
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
  h1{font-size:20px;font-weight:600}
  .meta{font-size:12px;color:var(--dim)}
  .meta b{color:var(--green)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;transition:border-color .2s}
  .card.on{border-color:rgba(62,207,110,.5)}
  .card.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .name{font-size:15px;font-weight:600}
  .state{font-size:12px;padding:3px 10px;border-radius:999px;
    background:rgba(239,83,80,.15);color:var(--red)}
  .state.on{background:rgba(62,207,110,.15);color:var(--green)}
  .vals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .vbox{text-align:center;background:rgba(255,255,255,.03);border-radius:8px;padding:8px 4px}
  .vbox .n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .vbox .u{font-size:10px;color:var(--dim);margin-top:2px}
  button{width:100%;padding:9px 0;border:0;border-radius:8px;cursor:pointer;
    font-size:14px;font-weight:600;color:#fff;background:var(--blue);
    transition:opacity .15s}
  button:hover{opacity:.85}
  button:disabled{opacity:.45;cursor:wait}
  button.off{background:#3a4152}
  .total{margin-top:16px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;
    align-items:center}
  .total .n{font-size:22px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
  .total .u{font-size:12px;color:var(--dim);margin-left:4px}
  .err{color:var(--red);font-size:12px;margin-top:10px;display:none}
  footer{margin-top:18px;font-size:11px;color:var(--dim);text-align:center}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:#22283a;color:var(--txt);padding:10px 18px;border-radius:8px;
    font-size:13px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚡ PTSP01 插排控制台</h1>
    <div class="meta">刷新 <b id="next">--</b>s 前 · 上次 <span id="upd">--</span></div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="total">
    <span style="color:var(--dim);font-size:13px">三孔总功率</span>
    <span><span class="n" id="tw">--</span><span class="u">W</span></span>
  </div>

  <div class="err" id="err">读取失败：设备通信异常，将自动重试</div>

  <footer>标定系数沿用 libpl7223 反汇编换算（V÷2²² / A·W÷2²⁴），功率绝对值待校准</footer>
</div>
<div id="toast"></div>

<script>
const NAMES = {1:'孔 1',2:'孔 2',3:'孔 3'};
let busy = {1:false,2:false,3:false};
let timer = null, countdown = 10;

function fmt(v, d){ return (v==null) ? '--' : Number(v).toFixed(d); }

function render(d){
  const g = document.getElementById('grid');
  const sockets = (d && d.sockets) || [];
  let html = '';
  for (let i = 1; i <= 3; i++){
    const s = sockets.find(x => x.id === i) || {on:false, err:true};
    const on = !!s.on, e = !!s.err;
    html += `
      <div class="card ${on?'on':''}">
        <div class="head">
          <span class="name">${NAMES[i]}</span>
          <span class="state ${on?'on':''}">${on?'ON':'OFF'}</span>
        </div>
        <div class="vals">
          <div class="vbox"><div class="n">${e?'--':fmt(s.v,1)}</div><div class="u">电压 V</div></div>
          <div class="vbox"><div class="n">${e?'--':fmt(s.a,3)}</div><div class="u">电流 A</div></div>
          <div class="vbox"><div class="n">${e?'--':fmt(s.w,2)}</div><div class="u">功率 W</div></div>
        </div>
        <button id="btn${i}" class="${on?'':'off'}" ${busy[i]?'disabled':''}
          onclick="toggle(${i})">${busy[i]?'操作中…':(on?'断开此孔':'接通此孔')}</button>
      </div>`;
  }
  g.innerHTML = html;
  const tw = (d && d.total_w != null) ? Number(d.total_w).toFixed(2) : '--';
  document.getElementById('tw').textContent = tw;
  document.getElementById('err').style.display = (d && d.ok) ? 'none' : 'block';
  document.getElementById('upd').textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  countdown = 10;
}

async function refresh(){
  try{
    const r = await fetch('/cgi-bin/status?_=' + Date.now());
    render(await r.json());
  }catch(e){
    document.getElementById('err').style.display = 'block';
    countdown = 10;
  }
}

async function toggle(id){
  busy[id] = true; renderKeep(id);
  try{
    const r = await fetch('/cgi-bin/switch?id=' + id + '&state=toggle');
    const j = await r.json();
    toast(j.ok ? '孔 ' + id + ' 已切换' : '操作失败：' + (j.err||''));
  }catch(e){ toast('请求失败'); }
  busy[id] = false;
  refresh();
}

function renderKeep(id){   // 切换中：只更新按钮状态
  const b = document.getElementById('btn'+id);
  if (b){ b.disabled = true; b.textContent = '操作中…'; }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 2500);
}

refresh();
setInterval(()=>{
  countdown--;
  document.getElementById('next').textContent = Math.max(countdown,0);
  if (countdown <= 0) refresh();
}, 1000);
</script>
</body>
</html>
